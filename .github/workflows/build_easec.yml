name: Build and Test Easec Interpreter

on:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # --- LINUX COMPILATION AND TESTING ---
    - name: Compile Interpreter & Run Tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        gcc -O3 easec_test.c -o easec_test -lm
        ./easec_test
        gcc -O3 easec.c -o easec -lm

    # --- MACOS COMPILATION AND TESTING ---
    - name: Compile Interpreter & Run Tests (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        clang -O3 easec_test.c -o easec_test
        ./easec_test
        clang -O3 easec.c -o easec

    # --- WINDOWS COMPILATION AND TESTING ---
    - name: Compile Interpreter & Run Tests (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cl.exe /O2 easec_test.c /Fe:easec_test.exe
        .\easec_test.exe
        cl.exe /O2 easec.c /Fe:easec.exe

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Binary Artifact (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: easec-${{ matrix.os }}
        path: easec

    - name: Upload Binary Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: easec-windows
        path: easec.exe