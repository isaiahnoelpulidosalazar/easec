name: Build easec interpreter

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt (Windows only)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: gcc -O3 easec/easec.c -o easec -lm

    - name: Compile (macOS)
      if: matrix.os == 'macos-latest'
      run: clang -O3 easec/easec.c -o easec

    - name: Compile (Windows)
      if: matrix.os == 'windows-latest'
      run: cl.exe /O2 easec/easec.c /Fe:easec.exe

    - name: Upload Binary Artifact (Linux/macOS)
      if: matrix.os != 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: easec-${{ matrix.os }}
        path: easec

    - name: Upload Binary Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: easec-windows
        path: easec.exe